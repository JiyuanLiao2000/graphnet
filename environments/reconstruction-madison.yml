# Madison/HTCondor reconstruction environment.
# Conversion intentionally uses a separate IceTray/Python 3.12 environment.
name: graphnet-reco
channels:
  - conda-forge
dependencies:
  - python=3.8.19
  - pip
  - icu=78.*
  - libgcc-ng=15.*
  - libstdcxx-ng=15.*
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - --find-links https://data.pyg.org/whl/torch-2.2.0+cu118.html
      - torch==2.2.0+cu118
      - dill==0.3.8
      - awkward==1.10.5
      - colorlog==6.8.2
      - ConfigUpdater==3.2
      - h5py==3.11.0
      - matplotlib==3.7.5
      - numpy==1.24.4
      - pandas==2.0.3
      - polars==0.20.21
      - pyarrow==15.0.2
      - pydantic==2.7.0
      - pytorch-lightning==2.2.2
      - scikit-learn==1.3.2
      - scipy==1.10.1
      - SQLAlchemy==2.0.29
      - timer==0.2.2
      - torchmetrics==1.3.2
      - tqdm==4.66.2
      - wandb==0.16.6
      - lightning-utilities==0.11.2
      - ruamel.yaml==0.18.6
      - torch-cluster==1.6.3+pt22cu118
      - torch-geometric==2.5.2
      - torch-scatter==2.1.2+pt22cu118
      - torch-sparse==0.6.18+pt22cu118
